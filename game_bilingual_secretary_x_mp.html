<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secretary Mission: Office Challenge</title>
  <style>
    :root {
      --primary: #2456a6;
      --primary-dark: #163c77;
      --success: #1d8a4e;
      --danger: #c94f4f;
      --warning: #f2a104;
      --bg: #f3f7ff;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #dbe4f3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      padding: 22px 16px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    }

    header h1 {
      font-size: 1.7rem;
      margin-bottom: 6px;
    }

    header p {
      opacity: 0.95;
      margin-bottom: 12px;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      margin-top: 10px;
    }

    .stats span {
      background: rgba(255,255,255,0.14);
      padding: 8px 12px;
      border-radius: 12px;
      font-weight: bold;
    }

    main {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px 40px;
    }

    h2, h3, h4 {
      margin-bottom: 10px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 8px 20px rgba(16, 45, 90, 0.06);
      margin-bottom: 16px;
    }

    .levels {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 14px;
      margin-top: 16px;
    }

    .level-btn {
      border: 1px solid var(--line);
      background: white;
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      text-align: left;
      transition: 0.2s;
      box-shadow: 0 4px 12px rgba(16, 45, 90, 0.05);
    }

    .level-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--primary);
    }

    .level-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .level-number {
      display: inline-block;
      background: var(--primary);
      color: white;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    .level-title {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .level-score {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .btn {
      display: inline-block;
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: bold;
      background: #e5eefc;
      color: var(--primary-dark);
      margin: 4px 4px 4px 0;
    }

    .btn.primary {
      background: var(--primary);
      color: white;
    }

    .btn.success {
      background: var(--success);
      color: white;
    }

    .btn.danger {
      background: var(--danger);
      color: white;
    }

    .btn.small {
      padding: 8px 12px;
      font-size: 0.9rem;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .desc {
      margin-bottom: 14px;
      color: #334155;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #c8d6ee;
      border-radius: 12px;
      font-size: 1rem;
      background: white;
    }

    textarea {
      resize: vertical;
      min-height: 130px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 14px;
    }

    .grid-two {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }

    .tag {
      display: inline-block;
      background: #e9f2ff;
      border: 1px solid #c8dcff;
      color: var(--primary-dark);
      padding: 6px 10px;
      border-radius: 999px;
      margin: 3px 3px 3px 0;
      font-weight: bold;
    }

    .order-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 760px) {
      .order-grid {
        grid-template-columns: 1fr;
      }
    }

    .choices,
    .selected {
      min-height: 180px;
      border: 2px dashed #bfd3f4;
      border-radius: 16px;
      padding: 12px;
      background: #fbfdff;
    }

    .selected {
      list-style-position: inside;
    }

    .chip {
      display: block;
      width: 100%;
      text-align: left;
      background: white;
      border: 1px solid #b9cdf1;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .chip:hover {
      background: #eef5ff;
    }

    .selected-chip {
      background: #eaf3ff;
      font-weight: bold;
    }

    .radio,
    .check {
      display: block;
      background: #fbfdff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 12px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .radio input,
    .check input {
      margin-right: 8px;
      transform: scale(1.1);
    }

    .result {
      margin-top: 16px;
      padding: 16px;
      border-radius: 16px;
      font-weight: bold;
    }

    .result.pass {
      background: #e8f8ef;
      border: 1px solid #bce7ce;
      color: #14532d;
    }

    .result.fail {
      background: #fff1f1;
      border: 1px solid #f4c7c7;
      color: #7f1d1d;
    }

    .feedback {
      margin-top: 12px;
    }

    details {
      background: #fbfdff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
    }

    summary {
      cursor: pointer;
      font-weight: bold;
      color: var(--primary-dark);
    }

    details ul {
      margin: 12px 0 0 18px;
    }

    details li {
      margin-bottom: 8px;
    }

    .muted {
      color: var(--muted);
    }

    .actions {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Secretary Mission: Office Challenge</h1>
    <p>Game Puzzle Bilingual untuk Kelas X Manajemen Perkantoran</p>
    <div class="stats">
      <span id="unlockedInfo">Level terbuka: 1/10</span>
      <span>Total Skor: <strong id="totalScore">0</strong>/100</span>
      <button class="btn danger small" onclick="resetProgress()">Reset Progres</button>
    </div>
  </header>

  <main>
    <section id="menu"></section>
    <section id="game" style="display:none;"></section>
  </main>

  <script>
    const $ = (selector) => document.querySelector(selector);

    function shuffle(array) {
      return array
        .map(value => [Math.random(), value])
        .sort((a, b) => a[0] - b[0])
        .map(item => item[1]);
    }

    function normalize(text) {
      return (text || "")
        .toLowerCase()
        .replace(/[.,/#!$%^&*;:{}=_~()?"']/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    const LEVELS = [
      {
        id: 1,
        title: "Match the Office Terms",
        titleId: "Mencocokkan Istilah Kantor",
        type: "match",
        max: 10,
        desc: "English: Match the English office words with the correct Indonesian meanings.<br>Indonesia: Jodohkan istilah kantor bahasa Inggris dengan arti bahasa Indonesia yang tepat."
      },
      {
        id: 2,
        title: "Scrambled Office Equipment",
        titleId: "Menyusun Nama Peralatan Kantor",
        type: "scramble",
        max: 8,
        desc: "English: Rearrange the letters to make correct English office equipment words.<br>Indonesia: Susun huruf acak menjadi nama peralatan kantor dalam bahasa Inggris."
      },
      {
        id: 3,
        title: "Complete the Office Sentences",
        titleId: "Melengkapi Kalimat Kantor",
        type: "sentence",
        max: 5,
        desc: "English: Choose the correct word to complete each sentence.<br>Indonesia: Pilih kata yang tepat untuk melengkapi kalimat kantor."
      },
      {
        id: 4,
        title: "Arrange the Telephone Procedure",
        titleId: "Mengurutkan Prosedur Telepon",
        type: "order4",
        max: 6,
        desc: "English: Arrange the steps into the correct procedure for answering a business phone call.<br>Indonesia: Urutkan langkah menerima telepon kantor dengan benar."
      },
      {
        id: 5,
        title: "Fill the Meeting Form",
        titleId: "Mengisi Formulir Rapat",
        type: "form5",
        max: 8,
        desc: "English: Read the memo and complete the meeting information form.<br>Indonesia: Bacalah memo dan lengkapi formulir informasi rapat."
      },
      {
        id: 6,
        title: "Email Triage Challenge",
        titleId: "Menangani Email Kantor",
        type: "email",
        max: 9,
        desc: "English: Decide whether each email is urgent, normal, or spam, then choose the correct action.<br>Indonesia: Tentukan kategori email dan tindakan yang paling tepat."
      },
      {
        id: 7,
        title: "Scheduling Logic Puzzle",
        titleId: "Logika Penjadwalan Rapat",
        type: "schedule",
        max: 10,
        desc: "English: Find the best meeting time based on the information.<br>Indonesia: Tentukan waktu rapat terbaik berdasarkan data yang tersedia."
      },
      {
        id: 8,
        title: "Alphabetical Filing Challenge",
        titleId: "Menyusun Arsip Alfabetis",
        type: "order8",
        max: 10,
        desc: "English: Arrange the client files alphabetically. Ignore the word PT.<br>Indonesia: Urutkan berkas klien secara alfabetis. Abaikan kata PT."
      },
      {
        id: 9,
        title: "Telephone Message Mission",
        titleId: "Membuat Pesan Telepon",
        type: "form9",
        max: 16,
        desc: "English: Read the conversation and complete the telephone message form. Assume the call is received at 10.00 a.m.<br>Indonesia: Bacalah percakapan dan lengkapi formulir pesan telepon. Anggap telepon diterima pukul 10.00."
      },
      {
        id: 10,
        title: "Boss Level: Save the Meeting",
        titleId: "Misi Sekretaris Lengkap",
        type: "boss",
        max: 18,
        desc: "English: Complete the full secretary mission: choose the room, arrange the agenda, select important documents, and write an email confirmation.<br>Indonesia: Selesaikan misi sekretaris lengkap: pilih ruang, susun agenda, pilih dokumen penting, dan tulis email konfirmasi."
      }
    ];

    const L1_TERMS = [
      { en: "Secretary", id: "Sekretaris" },
      { en: "Manager", id: "Manajer" },
      { en: "Meeting", id: "Rapat" },
      { en: "Schedule", id: "Jadwal" },
      { en: "Document", id: "Dokumen" },
      { en: "File", id: "Berkas / Arsip" },
      { en: "Letter", id: "Surat" },
      { en: "Envelope", id: "Amplop" },
      { en: "Stamp", id: "Perangko" },
      { en: "Printer", id: "Mesin Cetak" }
    ];

    const L1_OPTIONS = shuffle(L1_TERMS.map(item => item.id));

    const L2_WORDS = [
      { sc: "KEDS", ans: "DESK" },
      { sc: "RAHCI", ans: "CHAIR" },
      { sc: "TPRINRE", ans: "PRINTER" },
      { sc: "CANNERS", ans: "SCANNER" },
      { sc: "LFODER", ans: "FOLDER" },
      { sc: "VELOENEEP", ans: "ENVELOPE" },
      { sc: "TAPLSER", ans: "STAPLER" },
      { sc: "MPTOCOMER", ans: "COMPUTER" }
    ];

    const L3_WORDS = ["book", "answer", "file", "sign", "print"];
    const L3_OPTIONS = shuffle(L3_WORDS);

    const L3_SENTENCES = [
      { pre: "Please", post: "the meeting room for tomorrow morning.", answer: "book" },
      { pre: "The secretary must", post: "the telephone politely.", answer: "answer" },
      { pre: "Please", post: "the document in the correct folder.", answer: "file" },
      { pre: "The manager needs to", post: "the letter.", answer: "sign" },
      { pre: "I will", post: "the report for the meeting.", answer: "print" }
    ];

    const L4_ITEMS = {
      B: "Greet the caller and mention the company name. / Sapa penelepon dan sebutkan nama perusahaan.",
      F: "Offer help: How may I help you? / Tawarkan bantuan.",
      A: "Ask for the caller's name and company. / Tanyakan nama dan perusahaan penelepon.",
      D: "Listen to the caller's purpose. / Dengarkan tujuan penelepon.",
      C: "Take a message if the person is unavailable. / Catat pesan jika orang yang dicari tidak ada.",
      E: "End the call politely and say thank you. / Akhiri panggilan dengan sopan."
    };

    const L5_FIELDS = [
      { id: "event", label: "Event / Kegiatan", accepts: ["monthly meeting", "rapat bulanan"] },
      { id: "day", label: "Day / Hari", accepts: ["thursday", "kamis"] },
      { id: "date", label: "Date / Tanggal", accepts: ["17 september 2026", "17 september", "17 09 2026"] },
      { id: "time", label: "Time / Waktu", special: "time" },
      { id: "venue", label: "Venue / Tempat", accepts: ["meeting room 2", "ruang rapat 2"] },
      { id: "organizer", label: "Organizer / Penyelenggara", accepts: ["hrd", "ms rina", "rina"] },
      { id: "contact", label: "Contact Person / Narahubung", accepts: ["ms rina", "rina", "extension 204", "ext 204", "204"] },
      { id: "agenda", label: "Agenda", special: "agenda" }
    ];

    const L6_EMAILS = [
      {
        id: 1,
        subject: "Urgent: Client Contract Needs Signature",
        body: "The client contract must be signed by the Director today before 12.00. Please send the document immediately.",
        category: "urgent",
        action: "Segera teruskan/proses sekarang"
      },
      {
        id: 2,
        subject: "Office Lunch Menu",
        body: "Please choose the lunch menu for Friday's office gathering.",
        category: "normal",
        action: "Tindak lanjuti nanti / balas jika perlu"
      },
      {
        id: 3,
        subject: "Congratulations! You Won a Free Laptop!",
        body: "Click this link now to claim your prize. You only need to send your password and bank account number.",
        category: "spam",
        action: "Hapus/laporkan sebagai spam"
      }
    ];

    const L6_CATEGORIES = [
      { value: "", label: "Pilih kategori / Choose category" },
      { value: "urgent", label: "Urgent / Mendesak" },
      { value: "normal", label: "Normal / Biasa" },
      { value: "spam", label: "Spam / Spam" }
    ];

    const L6_ACTIONS = [
      "Segera teruskan/proses sekarang",
      "Tindak lanjuti nanti / balas jika perlu",
      "Hapus/laporkan sebagai spam",
      "Simpan sebagai arsip"
    ];

    const L7_OPTIONS = [
      { id: "tue", label: "Tuesday, 15 September 2026, 10.00-12.00" },
      { id: "wed10", label: "Wednesday, 16 September 2026, 10.00-12.00", correct: true },
      { id: "wed9", label: "Wednesday, 16 September 2026, 09.00-11.00" },
      { id: "thu", label: "Thursday, 17 September 2026, 13.00-15.00" }
    ];

    const L8_ITEMS = {
      NUSJ: "PT Nusantara Jaya",
      MAJ: "PT Maju Bersama",
      AND: "PT Andalan Sejahtera",
      NUSA: "PT Nusantara Abadi",
      CAH: "PT Cahaya Makmur"
    };

    const L9_FIELDS = [
      { id: "date", label: "Date / Tanggal", weight: 1, accepts: ["15 september 2026", "tuesday", "selasa"] },
      { id: "time", label: "Time received / Waktu diterima", weight: 1, accepts: ["10.00", "10:00", "10 am", "10 a m", "10"] },
      { id: "for", label: "Message for / Untuk", weight: 2, accepts: ["mr ardi", "ardi"] },
      { id: "caller", label: "Caller's name / Nama penelepon", weight: 2, accepts: ["mrs lina", "lina"] },
      { id: "company", label: "Company / Perusahaan", weight: 2, accepts: ["pt cipta media", "cipta media"] },
      { id: "phone", label: "Phone number / Nomor telepon", weight: 2, accepts: ["0812 3456 7890", "081234567890", "0812 34567890"] },
      { id: "message", label: "Message / Pesan", weight: 3, special: "message" },
      { id: "action", label: "Action needed / Tindakan", weight: 2, special: "action" },
      { id: "taken", label: "Taken by / Dicatat oleh", weight: 1, accepts: ["secretary", "secretaris", "receptionist", "resepsionis"] }
    ];

    const L10_ROOMS = [
      { id: "A", label: "Room A: capacity 5 people, no projector, available" },
      { id: "B", label: "Room B: capacity 10 people, projector, available", correct: true },
      { id: "C", label: "Room C: capacity 20 people, projector, under renovation" }
    ];

    const L10_AGENDA_ITEMS = {
      open: "Opening by Director / Pembukaan oleh Direktur",
      present: "Client presentation / Presentasi klien",
      discuss: "Discussion of contract / Diskusi kontrak",
      sign: "Signing of agreement / Penandatanganan perjanjian",
      close: "Closing and photo session / Penutupan dan foto bersama"
    };

    const L10_DOCS = [
      { id: "agenda", label: "Agenda / Agenda", correct: true },
      { id: "attendance", label: "Attendance list / Daftar hadir", correct: true },
      { id: "contract", label: "Contract draft / Draft kontrak", correct: true },
      { id: "client", label: "Client profile / Profil klien", correct: true },
      { id: "minutes", label: "Minutes form / Formulir notulen", correct: true },
      { id: "game", label: "Game magazine / Majalah game", correct: false },
      { id: "shopping", label: "Personal shopping list / Daftar belanja pribadi", correct: false },
      { id: "invitation", label: "Meeting invitation / Undangan rapat", correct: true }
    ];

    const orderConfigs = {
      4: {
        items: L4_ITEMS,
        shuffled: shuffle(["B", "F", "A", "D", "C", "E"]),
        correct: ["B", "F", "A", "D", "C", "E"]
      },
      8: {
        items: L8_ITEMS,
        shuffled: shuffle(["NUSJ", "MAJ", "AND", "NUSA", "CAH"]),
        correct: ["AND", "CAH", "MAJ", "NUSA", "NUSJ"]
      },
      10: {
        items: L10_AGENDA_ITEMS,
        shuffled: shuffle(["close", "discuss", "open", "sign", "present"]),
        correct: ["open", "present", "discuss", "sign", "close"]
      }
    };

    const state = {
      unlocked: 1,
      best: {},
      current: 1,
      order: {
        4: [],
        8: [],
        10: []
      }
    };

    try {
      const saved = JSON.parse(localStorage.getItem("secretaryMission") || "{}");
      if (saved.unlocked) state.unlocked = saved.unlocked;
      if (saved.best) state.best = saved.best;
    } catch (error) {
      console.log("Local storage tidak tersedia.");
    }

    function saveProgress() {
      try {
        localStorage.setItem("secretaryMission", JSON.stringify({
          unlocked: state.unlocked,
          best: state.best
        }));
      } catch (error) {
        console.log("Local storage tidak tersedia.");
      }
    }

    function totalScore() {
      return Object.values(state.best).reduce((total, value) => total + value, 0);
    }

    function updateHeader() {
      $("#totalScore").textContent = totalScore();
      $("#unlockedInfo").textContent = `Level terbuka: ${Math.min(state.unlocked, 10)}/10`;
    }

    function resetProgress() {
      const confirmReset = confirm("Yakin ingin menghapus semua progres game? / Do you want to reset all progress?");
      if (!confirmReset) return;
      state.unlocked = 1;
      state.best = {};
      state.order = { 4: [], 8: [], 10: [] };
      try {
        localStorage.removeItem("secretaryMission");
      } catch (error) {}
      showMenu();
    }

    function renderMenu() {
      const menu = $("#menu");
      menu.innerHTML = `
        <h2>Pilih Level / Select Level</h2>
        <p class="muted">Selesaikan minimal 70% pada setiap level untuk membuka level berikutnya. / Complete at least 70% of each level to unlock the next level.</p>
        <div class="levels">
          ${LEVELS.map(level => {
            const unlocked = level.id <= state.unlocked;
            const best = state.best[level.id] || 0;
            return `
              <button class="level-btn" onclick="startLevel(${level.id})" ${unlocked ? "" : "disabled"}>
                <span class="level-number">Level ${level.id}</span>
                <span class="level-title">${level.title}</span>
                <span class="level-score">Skor: ${best}/${level.max}</span>
              </button>
            `;
          }).join("")}
        </div>
      `;
    }

    function showMenu() {
      $("#menu").style.display = "block";
      $("#game").style.display = "none";
      renderMenu();
      updateHeader();
    }

    function startLevel(id) {
      if (id > state.unlocked) return;
      state.current = id;

      if ([4, 8, 10].includes(id)) {
        state.order[id] = [];
      }

      $("#menu").style.display = "none";
      $("#game").style.display = "block";
      renderLevel(id);
      updateHeader();
      window.scrollTo(0, 0);
    }

    function renderLevel(id) {
      const level = LEVELS.find(item => item.id === id);

      $("#game").innerHTML = `
        <div class="topbar">
          <button class="btn small" onclick="showMenu()">⬅ Menu</button>
          <div>
            <h2>Level ${level.id}: ${level.title}</h2>
            <p class="muted">${level.titleId}</p>
          </div>
        </div>
        <p class="desc">${level.desc}</p>
        <div id="content" class="card"></div>
        <div class="actions">
          <button id="checkBtn" class="btn primary" onclick="checkLevel(${level.id})">Periksa Jawaban / Check Answer</button>
          <button id="retryBtn" class="btn" style="display:none;" onclick="startLevel(${level.id})">Ulangi / Retry</button>
          <button id="nextBtn" class="btn success" style="display:none;">Level Berikutnya / Next ➡</button>
          <button class="btn" onclick="showMenu()">Kembali ke Menu / Back to Menu</button>
        </div>
        <div id="result"></div>
      `;

      const content = $("#content");

      if (level.type === "match") renderMatch(content);
      if (level.type === "scramble") renderScramble(content);
      if (level.type === "sentence") renderSentence(content);
      if (level.type === "order4") renderOrderArea(4, content);
      if (level.type === "form5") renderForm(content, L5_FIELDS, "l5");
      if (level.type === "email") renderEmail(content);
      if (level.type === "schedule") renderSchedule(content);
      if (level.type === "order8") renderOrderArea(8, content);
      if (level.type === "form9") renderForm(content, L9_FIELDS, "l9");
      if (level.type === "boss") renderBoss(content);
    }

    function renderMatch(container) {
      container.innerHTML = `
        <div class="grid-two">
          ${L1_TERMS.map((term, index) => `
            <div class="field">
              <label>${index + 1}. ${term.en}</label>
              <select id="l1-${index}">
                <option value="">Pilih arti / Choose meaning</option>
                ${L1_OPTIONS.map(option => `<option value="${option}">${option}</option>`).join("")}
              </select>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderScramble(container) {
      container.innerHTML = `
        ${L2_WORDS.map((word, index) => `
          <div class="field">
            <label>${index + 1}. ${word.sc}</label>
            <input type="text" id="l2-${index}" placeholder="Tulis jawaban bahasa Inggris / Write English answer" />
          </div>
        `).join("")}
      `;
    }

    function renderSentence(container) {
      container.innerHTML = `
        <p><strong>Word Bank / Bank Kata:</strong></p>
        <p>${L3_WORDS.map(word => `<span class="tag">${word}</span>`).join("")}</p>
        <br>
        ${L3_SENTENCES.map((sentence, index) => `
          <div class="field">
            <label>${index + 1}. ${sentence.pre} ______ ${sentence.post}</label>
            <select id="l3-${index}">
              <option value="">Pilih kata / Choose word</option>
              ${L3_OPTIONS.map(word => `<option value="${word}">${word}</option>`).join("")}
            </select>
          </div>
        `).join("")}
      `;
    }

    function orderHtml(key) {
      return `
        <div class="order-grid">
          <div class="order-col">
            <h4>Pilihan / Options</h4>
            <div id="available-${key}" class="choices"></div>
          </div>
          <div class="order-col">
            <h4>Urutan Jawaban / Answer Order</h4>
            <ol id="selected-${key}" class="selected"></ol>
            <button type="button" class="btn small" onclick="resetOrder(${key})">Reset Urutan</button>
          </div>
        </div>
      `;
    }

    function renderOrderArea(key, container) {
      container.innerHTML = orderHtml(key);
      drawOrder(key);
    }

    function drawOrder(key) {
      const config = orderConfigs[key];
      const selected = state.order[key] || [];
      const available = config.shuffled.filter(id => !selected.includes(id));

      document.getElementById(`available-${key}`).innerHTML = available.length
        ? available.map(id => `
            <button type="button" class="chip" onclick="addOrder(${key}, '${id}')">
              ${config.items[id]}
            </button>
          `).join("")
        : `<p class="muted">Semua pilihan sudah dipindahkan. / All choices have been moved.</p>`;

      document.getElementById(`selected-${key}`).innerHTML = selected.length
        ? selected.map((id, index) => `
            <li>
              <button type="button" class="chip selected-chip" onclick="removeOrder(${key}, ${index})" title="Klik untuk menghapus / Click to remove">
                ${index + 1}. ${config.items[id]}
              </button>
            </li>
          `).join("")
        : `<li class="muted">Klik pilihan di samping untuk menyusun urutan. / Click options to arrange the order.</li>`;
    }

    function addOrder(key, id) {
      if (!state.order[key].includes(id)) {
        state.order[key].push(id);
        drawOrder(key);
      }
    }

    function removeOrder(key, index) {
      state.order[key].splice(index, 1);
      drawOrder(key);
    }

    function resetOrder(key) {
      state.order[key] = [];
      drawOrder(key);
    }

    function renderForm(container, fields, prefix) {
      container.innerHTML = `
        <div class="form-grid">
          ${fields.map(field => `
            <div class="field">
              <label for="${prefix}-${field.id}">${field.label}</label>
              <input type="text" id="${prefix}-${field.id}" placeholder="Tulis jawaban / Write answer" />
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderEmail(container) {
      container.innerHTML = `
        ${L6_EMAILS.map((email, index) => `
          <div class="card">
            <h4>Email ${index + 1}: ${email.subject}</h4>
            <p style="margin-bottom:12px;">${email.body}</p>
            <div class="field">
              <label>Kategori / Category</label>
              <select id="l6-cat-${email.id}">
                ${L6_CATEGORIES.map(category => `<option value="${category.value}">${category.label}</option>`).join("")}
              </select>
            </div>
            <div class="field">
              <label>Tindakan / Action</label>
              <select id="l6-action-${email.id}">
                <option value="">Pilih tindakan / Choose action</option>
                ${L6_ACTIONS.map(action => `<option value="${action}">${action}</option>`).join("")}
              </select>
            </div>
          </div>
        `).join("")}
      `;
    }

    function renderSchedule(container) {
      container.innerHTML = `
        <div class="card">
          <h4>Data Jadwal / Schedule Data</h4>
          <p><strong>Director's availability / Ketersediaan Direktur:</strong><br>
          Tuesday, 15 September 2026: 10.00-12.00<br>
          Wednesday, 16 September 2026: 10.00-12.00<br>
          Thursday, 17 September 2026: 13.00-15.00</p>
          <br>
          <p><strong>Client's availability / Ketersediaan Klien:</strong><br>
          Wednesday morning only / Hanya Rabu pagi</p>
          <br>
          <p><strong>Meeting room availability / Ketersediaan Ruang Rapat:</strong><br>
          Wednesday: 10.00-12.00<br>
          Thursday: 13.00-16.00</p>
          <br>
          <p><strong>Meeting duration / Durasi rapat:</strong> 2 hours / 2 jam</p>
        </div>

        <div class="card">
          <h4>Pilih Waktu Terbaik / Choose the Best Time</h4>
          ${L7_OPTIONS.map(option => `
            <label class="radio">
              <input type="radio" name="l7" value="${option.id}" />
              ${option.label}
            </label>
          `).join("")}
        </div>
      `;
    }

    function renderBoss(container) {
      container.innerHTML = `
        <div class="card">
          <h3>A. Choose Meeting Room / Pilih Ruang Rapat</h3>
          <p class="muted">Participants: 8 people. Need projector and enough capacity.<br>Peserta: 8 orang. Butuh proyektor dan ruang yang cukup.</p>
          <br>
          ${L10_ROOMS.map(room => `
            <label class="radio">
              <input type="radio" name="l10room" value="${room.id}" />
              ${room.label}
            </label>
          `).join("")}
        </div>

        <div class="card">
          <h3>B. Arrange Agenda / Susun Agenda</h3>
          ${orderHtml(10)}
        </div>

        <div class="card">
          <h3>C. Document Checklist / Checklist Dokumen</h3>
          <p class="muted">Pilih dokumen yang penting untuk rapat. / Choose important documents for the meeting.</p>
          <br>
          ${L10_DOCS.map(doc => `
            <label class="check">
              <input type="checkbox" id="doc-${doc.id}" value="${doc.id}" />
              ${doc.label}
            </label>
          `).join("")}
        </div>

        <div class="card">
          <h3>D. Email Confirmation / Konfirmasi Email</h3>
          <p class="muted">Tulis email konfirmasi singkat dalam bahasa Inggris. Sertakan nama rapat, hari/tanggal, waktu, ruang, dan agenda.<br>Write a short confirmation email in English. Include meeting name, day/date, time, room, and agenda.</p>
          <br>
          <textarea id="l10-email" placeholder="Example: Dear Sir/Madam, We would like to confirm the Client Partnership Meeting on Wednesday, 16 September 2026 at 09.00-12.00 in Meeting Room B. The agenda includes client presentation, contract discussion, and signing of agreement. Sincerely, Secretary."></textarea>
        </div>
      `;
      drawOrder(10);
    }

    function scoreOrder(key, maxScore, pointPerCorrect) {
      const config = orderConfigs[key];
      const answer = state.order[key] || [];
      let correctCount = 0;

      for (let i = 0; i < config.correct.length; i++) {
        if (answer[i] === config.correct[i]) {
          correctCount++;
        }
      }

      return Math.min(maxScore, correctCount * pointPerCorrect);
    }

    function checkForm(fields, prefix) {
      let score = 0;

      fields.forEach(field => {
        const element = document.getElementById(`${prefix}-${field.id}`);
        if (!element) return;

        const value = normalize(element.value);
        let correct = false;

        if (field.special === "agenda") {
          correct =
            (value.includes("performance") || value.includes("kinerja")) &&
            (value.includes("training") || value.includes("pelatihan"));
        } else if (field.special === "time") {
          correct = (value.includes("09") || value.includes("9")) && value.includes("11");
        } else if (field.special === "message") {
          correct =
            (value.includes("call") || value.includes("hubungi")) &&
            (value.includes("contract") || value.includes("kontrak")) &&
            (value.includes("3") || value.includes("15"));
        } else if (field.special === "action") {
          correct =
            value.includes("ardi") &&
            (
              value.includes("call") ||
              value.includes("hubungi") ||
              value.includes("message") ||
              value.includes("pesan")
            );
        } else {
          correct = (field.accepts || []).some(accept => value.includes(normalize(accept)));
        }

        if (correct) {
          score += field.weight || 1;
        }
      });

      return score;
    }

    function checkLevel(id) {
      const level = LEVELS.find(item => item.id === id);
      let score = 0;
      const feedback = [];

      if (id === 1) {
        L1_TERMS.forEach((term, index) => {
          const value = document.getElementById(`l1-${index}`).value;
          if (value === term.id) score += 1;
        });
        feedback.push("Kunci jawaban: " + L1_TERMS.map(term => `${term.en} = ${term.id}`).join("; "));
      }

      if (id === 2) {
        L2_WORDS.forEach((word, index) => {
          const value = normalize(document.getElementById(`l2-${index}`).value).replace(/\s/g, "");
          if (value === normalize(word.ans).replace(/\s/g, "")) score += 1;
        });
        feedback.push("Kunci jawaban: " + L2_WORDS.map(word => word.ans).join(", "));
      }

      if (id === 3) {
        L3_SENTENCES.forEach((sentence, index) => {
          const value = document.getElementById(`l3-${index}`).value;
          if (value === sentence.answer) score += 1;
        });
        feedback.push("Kunci jawaban: " + L3_SENTENCES.map(sentence => sentence.answer).join(", "));
      }

      if (id === 4) {
        score = scoreOrder(4, 6, 1);
        feedback.push("Urutan benar: " + orderConfigs[4].correct.map(code => orderConfigs[4].items[code]).join(" → "));
      }

      if (id === 5) {
        score = checkForm(L5_FIELDS, "l5");
        feedback.push("Formulir harus sesuai memo: Monthly Meeting, Thursday, 17 September 2026, 09.00-11.00, Meeting Room 2, Ms. Rina/HRD, agenda performance report and training schedule.");
      }

      if (id === 6) {
        L6_EMAILS.forEach(email => {
          const category = document.getElementById(`l6-cat-${email.id}`).value;
          const action = document.getElementById(`l6-action-${email.id}`).value;

          if (category === email.category) score += 1;
          if (action === email.action) score += 2;
        });
        feedback.push("Kunci: Email 1 = urgent, segera proses. Email 2 = normal, tindak lanjuti nanti. Email 3 = spam, hapus/laporkan.");
      }

      if (id === 7) {
        const selected = document.querySelector('input[name="l7"]:checked');
        if (selected && selected.value === "wed10") score = 10;
        feedback.push("Jawaban terbaik: Wednesday, 16 September 2026, 10.00-12.00.");
      }

      if (id === 8) {
        score = scoreOrder(8, 10, 2);
        feedback.push("Urutan arsip benar: " + orderConfigs[8].correct.map((code, index) => `${index + 1}. ${orderConfigs[8].items[code]}`).join(" | "));
        feedback.push("Contoh kode arsip: AND-01, CAH-01, MAJ-01, NUS-01, NUS-02.");
      }

      if (id === 9) {
        score = checkForm(L9_FIELDS, "l9");
        feedback.push("Pastikan pesan memuat: Mr. Ardi, Mrs. Lina, PT Cipta Media, 0812-3456-7890, call back before 3 p.m., contract revision.");
      }

      if (id === 10) {
        const room = document.querySelector('input[name="l10room"]:checked');
        if (room && room.value === "B") {
          score += 3;
        } else {
          feedback.push("Room terbaik adalah Room B karena kapasitas 10 orang, ada proyektor, dan tersedia.");
        }

        score += scoreOrder(10, 5, 1);

        let correctDocs = 0;
        let wrongDocs = 0;

        L10_DOCS.forEach(doc => {
          const checkbox = document.getElementById(`doc-${doc.id}`);
          if (checkbox && checkbox.checked) {
            if (doc.correct) correctDocs++;
            else wrongDocs++;
          }
        });

        const checklistScore = Math.max(0, Math.min(5, correctDocs - wrongDocs));
        score += checklistScore;

        const emailValue = normalize(document.getElementById("l10-email").value);
        let emailScore = 0;

        if (/meeting|rapat|confirm|konfirmasi/.test(emailValue)) emailScore++;
        if (/wednesday|rabu|16 september/.test(emailValue)) emailScore++;
        if (/09|9:00|9 00/.test(emailValue)) emailScore++;
        if (/room b|ruang b/.test(emailValue)) emailScore++;
        if (/agenda|presentation|presentasi|contract|kontrak|signing|penandatanganan/.test(emailValue)) emailScore++;

        emailScore = Math.min(5, emailScore);
        score += emailScore;

        feedback.push("Boss Level: Room B. Agenda benar: Opening → Client presentation → Discussion of contract → Signing of agreement → Closing and photo session.");
      }

      score = Math.max(0, Math.min(level.max, Math.round(score)));
      state.best[id] = Math.max(state.best[id] || 0, score);

      const passed = score >= Math.ceil(level.max * 0.7);

      if (passed && state.unlocked === id && state.unlocked < 10) {
        state.unlocked++;
      }

      saveProgress();
      updateHeader();
      renderMenu();

      let finalMessage = "";

      if (id === 10 && passed) {
        const total = totalScore();
        let badge = "Trainee Secretary";

        if (total >= 90) badge = "Executive Secretary";
        else if (total >= 80) badge = "Senior Secretary";
        else if (total >= 70) badge = "Office Assistant";

        finalMessage = `
          <div class="result pass" style="margin-top:12px;">
            <strong>Selamat! Kamu telah menyelesaikan semua level.</strong><br>
            Skor total: <strong>${total}/100</strong><br>
            Gelar kamu: <strong>${badge}</strong>
          </div>
        `;
      }

      $("#result").innerHTML = `
        <div class="result ${passed ? "pass" : "fail"}">
          Skor Level / Level Score: <strong>${score}/${level.max}</strong><br>
          ${passed
            ? "Lulus! Kamu bisa lanjut ke level berikutnya. / Passed! You can continue to the next level."
            : "Belum lulus. Minimal 70%. Coba lagi! / Not yet passed. Minimum 70%. Try again!"}
        </div>
        ${finalMessage}
        <div class="feedback">
          <details>
            <summary>Lihat Kunci / Pembahasan / View Answer Key</summary>
            <ul>
              ${feedback.map(item => `<li>${item}</li>`).join("")}
            </ul>
          </details>
        </div>
      `;

      document.getElementById("retryBtn").style.display = "inline-block";

      const nextBtn = document.getElementById("nextBtn");
      if (passed && id < 10) {
        nextBtn.style.display = "inline-block";
        nextBtn.setAttribute("onclick", `startLevel(${id + 1})`);
      } else {
        nextBtn.style.display = "none";
      }

      $("#result").scrollIntoView({ behavior: "smooth" });
    }

    renderMenu();
    updateHeader();
  </script>
</body>
</html>
